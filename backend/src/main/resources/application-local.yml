server:
  port: ${SERVER_PORT:8081}
spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/talentos}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:2807}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      connection-test-query: SELECT 1

  jpa:
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    # Flyway picks up datasource creds automatically — no need to duplicate them

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    com.talentos: DEBUG
